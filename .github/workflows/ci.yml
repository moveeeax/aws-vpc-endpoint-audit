name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

      - name: Audit the bundled example payload
        run: |
          set +e
          aws-vpc-endpoint-audit --from-json examples/prod.json --format markdown
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit 1 from the example payload, got $code"
            exit 1
          fi
